volumes:
  datafiles:

services:
  vdcompanymvc:
    image: ${DOCKER_REGISTRY-}vdcompanymvc
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=db;Database=vdcompany;User ID=admin;Password=5@bcl0G5"
    build:
      context: .
      dockerfile: VDCompanyMVC/Dockerfile

  db:
    image: mysql:5.6.45
    ports:
      - "3307:3306"
    volumes:
      - datafiles:/var/lib/mysql
    restart: always
    environment: 
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: admin
      MYSQL_PASSWORD: 5@bcl0G5
      MYSQL_DATABASE: vdcompany

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - vdcompanymvc
    volumes:
      - ./nginx/debug/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
